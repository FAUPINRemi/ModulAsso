# Apache ne transmet pas l'environnement du conteneur à PHP : chaque variable lue par Symfony doit être listée ici.
PassEnv APP_ENV APP_DEBUG APP_SECRET_FILE DEFAULT_URI
PassEnv DATABASE_HOST DATABASE_PORT DATABASE_NAME DATABASE_USER
PassEnv RABBITMQ_HOST RABBITMQ_PORT RABBITMQ_VHOST RABBITMQ_USER

<VirtualHost *:${API_PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
