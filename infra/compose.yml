name: modulasso

x-durci: &durci
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-api: &api
  <<: *durci
  build:
    context: ../apps/api
    args:
      APP_ENV: ${APP_ENV}
      DEFAULT_URI: ${API_DEFAULT_URI}
  image: modulasso/api:local
  environment:
    APP_ENV: ${APP_ENV}
    APP_DEBUG: ${APP_DEBUG}
    APP_SECRET_FILE: ${APP_SECRET_FILE}
    DEFAULT_URI: ${API_DEFAULT_URI}
    API_PORT: ${API_PORT}
    DATABASE_HOST: ${DB_HOST}
    DATABASE_PORT: ${DB_PORT}
    DATABASE_NAME: ${DB_NAME}
    DATABASE_USER: ${DB_APP_USER}
    RABBITMQ_HOST: ${RABBITMQ_HOST}
    RABBITMQ_PORT: ${RABBITMQ_PORT}
    RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    RABBITMQ_USER: ${RABBITMQ_USER}
  secrets: [app_secret, db_app_password, rabbitmq_password]
  tmpfs: [/tmp]
  depends_on:
    db: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  db:
    <<: *durci
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: postgres
    environment:
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      DB_NAME: ${DB_NAME}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_APP_USER: ${DB_APP_USER}
      DB_STATS_USER: ${DB_STATS_USER}
    secrets: [db_superuser_password, db_owner_password, db_app_password, db_stats_password]
    volumes:
      - db_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: [/var/run/postgresql, /tmp]
    networks: [interne]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$DB_NAME"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *durci
    image: rabbitmq:4.1.8-management-alpine@sha256:b586ea9784425774ac56f3d4919e4f723edb3287ef8a6c4c8f0df8fe569747c3
    hostname: ${RABBITMQ_HOST}
    user: rabbitmq
    entrypoint: [/etc/rabbitmq/modulasso/demarrage.sh]
    environment:
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq:/etc/rabbitmq/modulasso:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-modulasso.conf:ro
    tmpfs: [/run/rabbitmq, /tmp]
    networks: [interne]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    <<: *api
    networks: [interne, sortie, admin]

  web:
    <<: *durci
    build: ../apps/web
    image: modulasso/web:local
    environment:
      API_URL: ${API_URL}
    tmpfs: [/tmp]
    depends_on: [api]
    networks: [traefik, interne]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.modulasso-web.rule=Host(`${MODULASSO_DOMAINE}`) && PathPrefix(`${MODULASSO_CHEMIN}`)
      - traefik.http.routers.modulasso-web.entrypoints=websecure
      - traefik.http.routers.modulasso-web.tls.certresolver=le
      - traefik.http.routers.modulasso-web.middlewares=${MODULASSO_ACCES_WEB}
      - traefik.http.services.modulasso-web.loadbalancer.server.port=${WEB_PORT}

networks:
  traefik:
    external: true
  interne:
    internal: true
  sortie: {}
  admin:
    internal: true

volumes:
  db_data: {}
  rabbitmq_data: {}

secrets:
  db_superuser_password:
    file: ${MODULASSO_SECRETS:-./secrets}/db_superuser_password
  db_owner_password:
    file: ${MODULASSO_SECRETS:-./secrets}/db_owner_password
  db_app_password:
    file: ${MODULASSO_SECRETS:-./secrets}/db_app_password
  db_stats_password:
    file: ${MODULASSO_SECRETS:-./secrets}/db_stats_password
  rabbitmq_password:
    file: ${MODULASSO_SECRETS:-./secrets}/rabbitmq_password
  app_secret:
    file: ${MODULASSO_SECRETS:-./secrets}/app_secret
